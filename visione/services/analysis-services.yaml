x-gpu-deploy: &gpu_deploy
  deploy:
    resources:
      limits:
        memory: 9G
      reservations:
        memory: 4G
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  environment:
    - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    - OMP_NUM_THREADS=4
    - MKL_NUM_THREADS=4
    - TORCH_SHOW_CPP_STACKTRACES=1
    # VRAM-aware offloading configuration
    # VISIONE_VRAM_THRESHOLD: fraction of free VRAM (0-1) required to keep model on GPU
    #   Lower this value to offload to CPU/SSD earlier (e.g. 0.5 on 6GB cards)
    - VISIONE_VRAM_THRESHOLD=${VISIONE_VRAM_THRESHOLD:-0.85}
    # VISIONE_OFFLOAD_MODE: "auto" | "cpu" | "disk"
    #   auto  -> probes VRAM, falls back CPU then disk
    #   cpu   -> always use CPU RAM (skip GPU entirely)
    #   disk  -> always shard model weights to /cache/model_offload
    - VISIONE_OFFLOAD_MODE=${VISIONE_OFFLOAD_MODE:-auto}
    # VISIONE_OFFLOAD_DIR: path inside the container where weight shards are written
    #   /cache is already mounted from VISIONE_CACHE on the host
    - VISIONE_OFFLOAD_DIR=/cache/model_offload

services:
  ffmpeg:
    image: jrottenberg/ffmpeg:5.1.2-nvidia2004
    entrypoint: []
    volumes:
      - ${VISIONE_ROOT}:/data
      - ${VISIONE_CACHE}:/cache
    profiles: ["analysis", "ffmpeg"]
    <<: *gpu_deploy

  scene-detection:
    build: ./analysis/scene-detection
    image: ghcr.io/swift2025/visione-scene-detection

    volumes: &common_volumes
      - ${VISIONE_ROOT}:/data
      - ${VISIONE_CACHE}:/cache
      - ./common:/usr/src/visione:ro
    profiles: ["analysis", "scene-detection"]

  objects-colors:
    build: ./analysis/objects-colors

    image: ghcr.io/swift2025/visione-objects-colors
    volumes: *common_volumes
    profiles: ["analysis", "objects-colors"]

  objects-mrcnn-lvis:
    build: ./analysis/objects-mmdet
    image: ghcr.io/swift2025/visione-objects-mmdet

    environment: ["DETECTOR_NAME=mrcnn-lvis"]
    volumes: *common_volumes
    profiles: ["analysis", "objects-mrcnn-lvis"]
    <<: *gpu_deploy

  objects-vfnet64-coco:
    build: ./analysis/objects-mmdet
    image: ghcr.io/swift2025/visione-objects-mmdet

    environment: ["DETECTOR_NAME=vfnet64-coco"]
    volumes: *common_volumes
    profiles: ["analysis", "objects-vfnet64-coco"]
    <<: *gpu_deploy

  objects-frcnn-oiv4:
    build: ./analysis/objects-openimagesv4
    image: ghcr.io/swift2025/visione-objects-openimagesv4

    volumes: *common_volumes
    profiles: ["analysis", "objects-frcnn-oiv4"]

  features-clip-openai:
    build: ./analysis/features-clip
    image: ghcr.io/swift2025/visione-features-clip
    depends_on:
      - faiss-index-manager

    environment:
      - FEATURES_NAME=clip-openai
      - MODEL_HANDLE=openai/clip-vit-large-patch14
    volumes: *common_volumes
    profiles: ["analysis", "features-clip-openai"]
    <<: *gpu_deploy
    shm_size: 16g

  features-clip-laion:
    build: ./analysis/features-clip
    image: ghcr.io/swift2025/visione-features-clip
    depends_on:
      - faiss-index-manager

    environment:
      - FEATURES_NAME=clip-laion
      - MODEL_HANDLE=laion/CLIP-ViT-H-14-laion2B-s32B-b79K
    volumes: *common_volumes
    profiles: ["analysis", "features-clip-laion"]
    <<: *gpu_deploy
    shm_size: 16g

  features-clip-datacomp:
    build: ./analysis/features-clip
    image: ghcr.io/swift2025/visione-features-clip
    depends_on:
      - faiss-index-manager

    environment:
      - FEATURES_NAME=clip-datacomp
      - MODEL_HANDLE=laion/CLIP-ViT-L-14-DataComp.XL-s13B-b90K
    volumes: *common_volumes
    profiles: ["analysis", "features-clip-datacomp"]
    <<: *gpu_deploy
    shm_size: 16g

  features-biomed-clip:
    build: ./analysis/features-openclip
    image: ghcr.io/swift2025/visione-features-openclip
    depends_on:
      - faiss-index-manager

    environment:
      - FEATURES_NAME=biomed-clip
      - MODEL_HANDLE=hf-hub:microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
    volumes: *common_volumes
    profiles: ["analysis", "features-biomed-clip"]
    <<: *gpu_deploy
    shm_size: 16g

  features-clip2video:
    build: ./analysis/features-clip2video
    image: ghcr.io/swift2025/visione-features-clip2video
    depends_on:
      - faiss-index-manager

    volumes: *common_volumes
    profiles: ["analysis", "features-clip2video"]
    <<: *gpu_deploy
    shm_size: 16g

  features-aladin:
    build:
      context: ./analysis/features-aladin
      secrets: ["asset_token"]
    image: ghcr.io/swift2025/visione-features-aladin:v2
    depends_on:
      - faiss-index-manager

    volumes: *common_volumes
    profiles: ["analysis", "features-aladin"]
    <<: *gpu_deploy
    shm_size: 16g

  features-dinov2:
    build: ./analysis/features-dinov2
    image: ghcr.io/swift2025/visione-features-dinov2:v2
    depends_on:
      - faiss-index-manager

    environment:
      - FEATURES_NAME=dinov2
      - MODEL=dinov2_vits14
    volumes: *common_volumes
    profiles: ["analysis", "features-dinov2"]
    <<: *gpu_deploy
    shm_size: 16g

  features-clipvip:
    build: ./analysis/features-clipvip
    image: ghcr.io/swift2025/visione-features-clipvip:v2
    depends_on:
      - faiss-index-manager

    volumes: *common_volumes
    profiles: ["analysis", "features-clipvip"]
    <<: *gpu_deploy
    shm_size: 16g

  frame-cluster:
    build: ./analysis/frame-cluster
    image: ghcr.io/swift2025/visione-frame-cluster

    volumes: *common_volumes
    profiles: ["analysis", "frame-cluster"]

  str-object-encoder:
    build: ./index/str-object-encoder
    image: ghcr.io/swift2025/visione-str-object-encoder

    volumes: *common_volumes
    profiles: ["analysis", "str-object-encoder"]

  str-feature-encoder:
    build: ./index/str-feature-encoder
    image: ghcr.io/swift2025/visione-str-feature-encoder

    volumes: *common_volumes
    profiles: ["analysis", "str-feature-encoder"]

  faiss-index-manager:
    build: ./index/faiss-index-manager
    image: ghcr.io/swift2025/visione-faiss-index-manager

    volumes: *common_volumes
    profiles: ["analysis", "faiss-index-manager"]
