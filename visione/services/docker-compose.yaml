secrets:
  asset_token:
    file: ${VISIONE_ROOT}/asset_token

volumes:
  model_cache:
    driver: local
  huggingface_cache:
    driver: local
  torch_cache:
    driver: local

x-desktop-deploy: &desktop_deploy
  deploy:
    resources:
      limits:
        memory: 4G
      reservations:
        memory: 2G
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  router:
    image: nginx:1.23.2
    ports: ["${VISIONE_PORT}:80"]
    environment:
      - VISIONE_VIDEOS_URL
      - VISIONE_RESIZED_VIDEOS_URL
      - VISIONE_FRAMES_URL
      - VISIONE_RESIZED_FRAMES_URL
      - VISIONE_PALETTE_URL
      - VISIONE_TRANSLATE_URL
      - VISIONE_SERVER_NAME
    volumes:
      - ./router:/etc/nginx/templates/
      - ./web-ui:/usr/share/nginx/html:ro
      - ${VISIONE_ROOT}:/data:ro
    depends_on: ["core"]
    profiles: ["query", "router"]

  core:
    build:
      context: ./core
      args:
        - TOMCAT_MANAGER_USER=${VISIONE_USERNAME}
        - TOMCAT_MANAGER_PASS=${VISIONE_PASSWORD}
    image: ghcr.io/swift2025/visione-core
    expose: ["8080"]
    volumes:
      - ${VISIONE_ROOT}:/data
    profiles: ["query", "core"]

  features-clip:
    build: ./analysis/features-clip
    image: ghcr.io/swift2025/visione-features-clip
    volumes:
      - ${VISIONE_ROOT}:/data
      - ${VISIONE_CACHE}:/cache
      - ./common:/usr/src/visione:ro
      - huggingface_cache:/cache/huggingface
      - torch_cache:/cache/torch
    environment:
      - FEATURES_NAME=clip-laion
      - MODEL_HANDLE=laion/CLIP-ViT-H-14-laion2B-s32B-b79K
    profiles: ["analysis", "features-clip"]
    <<: *desktop_deploy
